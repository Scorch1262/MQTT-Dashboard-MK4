name: Build

# Baut bei jedem Push automatisch (Aufbau wie Drucker Dashboard MK6):
#   - eine Windows-.exe (PyInstaller --onefile): MQTTDashboard.exe
#   - ein natives macOS-Binary fuer Apple Silicon (arm64) auf einem
#     macos-14-Runner (native arm64-Maschine, kein Cross-Compiling)
# und veroeffentlicht beide als Zip in einem GitHub Release.
#
# Der Tag-Name (Format "vX.Y.Z") wird direkt aus APP_VERSION in app.py
# abgeleitet - ein manueller `git tag` ist NICHT noetig. Wird ohne
# Versionserhoehung erneut gepusht, wird das bestehende Release mit
# demselben Tag aktualisiert statt ein neues anzulegen.
#
# `permissions: contents: write` ist noetig, weil der automatisch
# erzeugte GITHUB_TOKEN sonst je nach Repo-Einstellung nur Lesezugriff
# hat und das Anlegen des Release mit "403 Resource not accessible by
# integration" scheitert.
#
# Anders als MK6 gibt es hier weder FtpsUploadHelper noch FFmpeg - das
# Zip enthaelt nur die eine Programmdatei.

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name_suffix: windows
          - os: macos-14   # nativer Apple-Silicon (arm64) Runner
            asset_name_suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Versionsnummer aus app.py lesen
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('app.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Erkannte Version: $VERSION"

      - name: Programm mit PyInstaller bauen
        run: pyinstaller --onefile --name MQTTDashboard --console app.py

      - name: macOS - ausfuehrbar machen + zippen (bewahrt Exec-Bit)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/MQTTDashboard
          mkdir -p out
          cd dist && zip -j "../out/MQTTDashboard-v${{ steps.version.outputs.version }}-${{ matrix.asset_name_suffix }}.zip" MQTTDashboard

      - name: Windows - zippen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "dist/MQTTDashboard.exe" -DestinationPath "out/MQTTDashboard-v${{ steps.version.outputs.version }}-${{ matrix.asset_name_suffix }}.zip"

      - name: Als Build-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MQTTDashboard-v${{ steps.version.outputs.version }}-${{ matrix.asset_name_suffix }}
          path: out/*
          if-no-files-found: error

      - name: An GitHub Release anhaengen (immer, siehe Kommentar oben)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          files: out/*
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Hinweis macOS/Gatekeeper: Das macOS-Binary ist NICHT signiert oder
# notarisiert. Beim ersten Start: im Finder Rechtsklick -> "Oeffnen" ->
# "Trotzdem oeffnen", oder im Terminal:
#   xattr -dr com.apple.quarantine MQTTDashboard
